# 질의응답 평가셋 (2026-10-28 기준 보유 데이터: SK하이닉스·현대자동차 2025.03~2026.06, 삼성전자 2022.12~2026.06)
# 정답 숫자는 data/wiki 의 원문 표에서 확인한 값이다 (scripts/eval_qa.py --check 로 원문 존재 여부 재검사).
#
# 항목
#   q        질문
#   type     fact(원문 어휘) / synonym(동의어) / concept(개념→항목) / compare(여러 회사) / trend(여러 기간)
#            / cause(원인·전망·서술) / negative(보유하지 않은 회사·기간 → 답하지 않아야 함)
#   route    허용 경로 목록 (wiki / hybrid / vector / agent)
#   corps    질문 속 회사 (라우터 회사 인식 채점)
#   periods  회사별 기대 기간 (라우터 기간 인식 채점, 생략하면 채점 안 함)
#   expect   검색 정답 그룹: section(하나라도 포함) + corp + period. 모든 그룹이 상위 k 안에 있어야 성공
#   answer   답변 정답 숫자: 바깥 목록 = 모두 필요, 안쪽 목록 = 그중 하나면 됨
#   unit     answer 단위. 백만원이면 "131.9조원" 같은 환산 표기도 1% 오차 안에서 정답 처리
#   keywords 답변에 들어가야 할 단어 (바깥 = 모두, 안쪽 = 하나면 됨)
#   no_answer true 면 수치를 지어내지 않고 "보유하지 않음/찾지 못함"으로 답해야 정답
#   expect_max / expect_min  비교 결론: 답변이 '가장(더) 크다/많다/높다'(또는 작다/적다/낮다)라고 말한 회사가 이 회사여야 정답
#   expect_direction         추이 결론: 답변에 이 방향(증가/감소)이 순서대로 나와야 정답
#   expect_calc              계산값: {value, unit(% 또는 배), tol} — 답변의 % 또는 배 수치 중 하나가 허용오차 안이어야 정답

