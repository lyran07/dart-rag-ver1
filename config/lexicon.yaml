# 공시 도메인 사전 (코드 수정 없이 편집)
# - synonyms: 질문 표현 → 공시 원문 계정과목. BM25(어휘) 질의에만 덧붙인다 (dense 는 원 질문 그대로).
# - section_hints: 질문 키워드 → 답이 있을 법한 목차 키워드. 검색 필터가 아니라 "가산점" 으로만 쓴다
#   (필터로 걸면 라우팅이 틀렸을 때 정답을 조용히 놓친다).
# 회사별 규칙은 넣지 않는다. 모든 DART 정기보고서 공통 목차/용어만.

synonyms:
  인건비: [급여, 연간급여총액, 종업원급여, 1인평균급여액, 직원]
  영업손익: [영업이익, 영업손실, "영업이익(손실)"]
  현금창출력: [영업활동현금흐름, 영업활동으로 인한 현금흐름]
  빚: [부채총계, 차입금, 사채, 금융부채]
  부채: [부채총계, 차입금, 사채]
  배당: [현금배당금, 주당배당금, 배당성향, 배당총액]
  직원: [임직원, 근로자, 직원수, 1인평균급여액]
  R&D: [연구개발비, 연구개발활동, 연구개발]
  대주주: [최대주주, 특수관계인, 5% 이상 주주]
  매출: [매출액, 수익, 영업수익]
  순이익: [당기순이익, 당기순손익, 지배기업 소유주지분]
  설비투자: [시설투자, CAPEX, 유형자산의 취득]

# 의도(intent) 키워드 → 서술형 섹션 힌트. retrieval.multi_facet=true 일 때만 사용 (평가에서 효과를 분리하려고 따로 둠)
# DART 정기보고서 공통 목차: 시장 전망·산업 특성 = II-7 기타 참고사항, 실적 원인 분석 = IV 이사의 경영진단
narrative_hints:
  outlook:
    keywords: [전망, 예상, 향후, 앞으로, 계획, 업황, 시장 상황, 어떻게 될, 수요]
    sections: [기타 참고사항, 경영진단, 사업의 개요]
  cause:
    keywords: [왜, 이유, 원인, 영향, 배경, 적자, 나빠졌, 좋아졌, 회복]
    sections: [경영진단, 기타 참고사항]
  trend:
    keywords: [추이, 변화, 달라졌, 대비, 증감, 최근]
    sections: [요약재무, 경영진단, 매출]

section_hints:
  주주환원: [배당]
  공장: [생산설비]
  인건비: [임원 및 직원, 직원, 보수]
  직원: [임원 및 직원, 직원]
  급여: [임원 및 직원, 보수]
  배당: [배당]
  대주주: [주주에 관한, 최대주주]
  최대주주: [주주에 관한, 최대주주]
  연구개발: [연구개발]
  R&D: [연구개발]
  영업이익: [요약재무, 경영진단]
  영업손익: [요약재무, 경영진단]
  매출: [매출, 요약재무]
  현금: [현금흐름, 연결재무]
  부채: [요약재무, 연결재무]
  제품: [주요 제품, 사업의 개요]
  원재료: [원재료]
  소송: [우발부채, 소송, 제재]
  계열사: [계열회사, 타법인출자]
  이사회: [이사회]
  감사: [감사제도, 감사인]
  설비투자: [생산 및 설비, 시설투자]
