# 질문 → 위키 섹션 매핑표 (팀이 관리).
#   id        : 라우터가 고르는 섹션 키 (LLM 라우터에게 이 목록이 선택지로 주어진다)
#   desc      : 이 섹션에 무엇이 있는지 (LLM 라우터가 읽는 설명)
#   keywords  : 규칙 라우터가 질문에서 찾는 단어
#   match     : 위키 섹션 제목에 포함된 문자열 (DART 표준 목차 기준. 업종별 변형 제목도 잡히도록 짧게)
# 여기에 없는 주제나 여러 섹션을 엮어야 하는 질문은 hybrid / vector / agent 경로로 간다.

routes:
  - id: summary_financials
    desc: 요약재무정보 — 연결·별도 기준 매출액·영업이익·당기순이익·자산·부채·자본 등 핵심 수치 (최근 3개 기수)
    keywords: [매출, 매출액, 영업이익, 순이익, 당기순이익, 자산, 부채, 자본, 실적, 재무 요약, 요약재무]
    match: ["1. 요약재무정보"]
  - id: consolidated_statements
    desc: 연결재무제표 본표 — 연결 재무상태표·손익계산서·현금흐름표의 세부 계정
    keywords: [연결재무제표, 재무상태표, 손익계산서, 현금흐름, 포괄손익, 영업활동, 매출원가, 판관비, 판매비]
    match: ["2. 연결재무제표"]
  - id: separate_statements
    desc: 별도(개별)재무제표 본표
    keywords: [별도재무제표, 별도 기준, 개별재무제표]
    match: ["4. 재무제표"]
  - id: dividends
    desc: 배당에 관한 사항 — 주당배당금, 배당성향, 배당총액, 배당정책
    keywords: [배당, 배당금, 배당성향, 배당수익률, 주당배당]
    match: ["6. 배당에 관한 사항"]
  - id: business_overview
    desc: 사업의 개요 — 회사가 하는 사업, 사업 부문, 시장 환경 설명
    keywords: [사업 개요, 무슨 사업, 사업 부문, 주력 사업, 하는 일, 사업 구조]
    match: ["사업의 개요"]
  - id: products
    desc: 주요 제품 및 서비스 — 제품별 매출 비중, 가격 변동
    keywords: [주요 제품, 제품별, 매출 비중, 제품 가격, 서비스별]
    match: ["주요 제품 및 서비스"]
  - id: raw_materials
    desc: 원재료 및 생산설비 — 원재료 가격, 생산능력, 가동률, 설비투자
    keywords: [원재료, 생산능력, 가동률, 생산설비, 설비투자, CAPA, 캐파]
    match: ["원재료 및 생산설비"]
  - id: sales_orders
    desc: 매출 및 수주상황 — 지역·부문별 매출 실적, 판매경로, 수주 현황
    keywords: [수주, 판매 실적, 지역별 매출, 부문별 매출, 판매경로, 수출, 내수]
    match: ["매출 및 수주상황"]
  - id: risk_derivatives
    desc: 위험관리 및 파생거래 — 환율·금리 리스크 관리, 파생상품
    keywords: [환율, 금리 위험, 파생, 위험관리, 리스크 관리, 헤지]
    match: ["위험관리 및 파생거래"]
  - id: rnd_contracts
    desc: 주요계약 및 연구개발활동 — 연구개발비, 연구개발 실적, 주요 계약
    keywords: [연구개발, R&D, 연구개발비, 주요 계약, 특허]
    match: ["주요계약 및 연구개발활동"]
  - id: mdna
    desc: 이사의 경영진단 및 분석의견 — 경영진이 설명하는 실적 변동 원인과 전망
    keywords: [경영진단, 경영진 의견, 분석의견]
    match: ["IV. 이사의 경영진단"]
  - id: shareholders
    desc: 주주에 관한 사항 — 최대주주와 특수관계인 지분, 5% 이상 주주, 소액주주
    keywords: [최대주주, 대주주, 지분율, 주주 구성, 소액주주, 5% 이상]
    match: ["VII. 주주에 관한 사항"]
  - id: shares
    desc: 주식의 총수 — 발행주식 수, 자기주식(자사주)
    keywords: [발행주식, 주식 수, 주식수, 자기주식, 자사주, 유통주식]
    match: ["4. 주식의 총수 등"]
  - id: employees
    desc: 임원 및 직원 현황 — 직원 수, 평균 근속연수, 1인 평균 급여, 임원 명단
    keywords: [직원, 임직원, 직원 수, 근속, 평균 급여, 연봉, 임원 현황, 남녀]
    match: ["1. 임원 및 직원 등의 현황"]
  - id: exec_pay
    desc: 임원의 보수 — 이사·감사 보수 총액, 개인별 보수
    keywords: [임원 보수, 이사 보수, 보수 총액, 개인별 보수, 연봉 5억]
    match: ["2. 임원의 보수 등"]
  - id: affiliates
    desc: 계열회사 현황 — 계열사 수, 계열사 목록
    keywords: [계열사, 계열회사, 그룹사]
    match: ["IX. 계열회사 등에 관한 사항"]
  - id: subsidiaries
    desc: 연결대상 종속회사 현황(상세) — 종속회사 목록과 지분
    keywords: [종속회사, 자회사, 연결대상]
    match: ["1. 연결대상 종속회사 현황"]
  - id: history
    desc: 회사의 연혁 — 설립, 주요 변동 이력
    keywords: [연혁, 설립, 역사, 창립]
    match: ["2. 회사의 연혁"]
  - id: audit
    desc: 외부감사에 관한 사항 — 감사인, 감사의견, 감사보수
    keywords: [감사인, 감사의견, 회계법인, 외부감사, 감사보수]
    match: ["1. 외부감사에 관한 사항"]
  - id: contingencies
    desc: 우발부채 등 — 소송, 채무보증, 약정
    keywords: [소송, 우발부채, 채무보증, 약정, 분쟁]
    match: ["2. 우발부채 등에 관한 사항"]
